[project]
name = "travel-agent"
version = "0.1.0"
description = "旅行智能体 — LangGraph 多 agent 行程规划与预订"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Travel-Agent Contributors" }]

dependencies = [
    "langgraph>=0.2.60",
    "openai>=1.50.0",
    "amadeus>=8.1.0",
    "googlemaps>=4.10.0",
    "httpx>=0.27.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "streamlit>=1.40.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",      # httpx mock
    "ruff>=0.7",
]
redis = ["redis>=5.0"]
server = ["fastapi>=0.115", "uvicorn>=0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
